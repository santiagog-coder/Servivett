<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo — Servivett</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #008080;
      --primary-dark: #006666;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 400px; background: var(--card); border-radius: 24px; padding: 32px 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid var(--border); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.45rem; font-weight: 800; color: var(--primary); }
    .header p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.95rem; outline: none; transition: 0.2s; background: #fff; }
    input:focus { border-color: var(--primary); }
    .btn-submit { width: 100%; background: var(--primary); color: white; padding: 13px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 6px; transition: 0.2s; }
    .btn-submit:hover { background: var(--primary-dark); }
    .error-msg { display: none; background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); font-size: 0.8rem; font-weight: 600; padding: 10px; border-radius: 10px; margin-bottom: 16px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Servivett Clínica</h1>
      <p>Terminal de Control y Caja</p>
    </div>

    <div id="error-alert" class="error-msg">Usuario o contraseña incorrectos</div>

    <form onsubmit="iniciarSesion(event)">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="user" placeholder="admin" required autocomplete="username">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="btn-login">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://llwbvbzrbdxlrhswgjft.supabase.co";
    const SUPABASE_KEY = "sb_publishable_1k62mMMn9VzV_IT1tf2M-g_NDAeLMZX";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function iniciarSesion(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      const error = document.getElementById("error-alert");
      btn.disabled = true;
      btn.textContent = "Verificando...";
      error.style.display = "none";

      const u = document.getElementById("user").value.trim();
      const p = document.getElementById("pass").value.trim();

      try {
        const { data, error: errRpc } = await supabaseClient
          .rpc("autenticar_personal", { p_user: u, p_pass: p });

        if (errRpc) throw errRpc;

        if (data && data.length > 0 && data[0].autorizado) {
          // Guardar sesión activa con timestamp y rol
          const sessionPayload = {
            user: u,
            role: data[0].rol,
            loggedAt: Date.now()
          };
          localStorage.setItem("svt_auth_session", JSON.stringify(sessionPayload));

          // Redireccionar al destino original o a /nuevo/
          const params = new URLSearchParams(window.location.search);
          const redirectUrl = params.get("redirect") || "/nuevo/";
          window.location.replace(redirectUrl);
        } else {
          error.style.display = "block";
        }
      } catch (err) {
        console.error("Error al autenticar:", err);
        error.textContent = "Error al conectar con el servidor.";
        error.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ingresar al Sistema";
      }
    }
  </script>
</body>
</html>
</html>
