<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    // GUARDIÁN DE RUTA PRIVADA
    (function() {
      const rawSession = localStorage.getItem("svt_auth_session");
      let autenticado = false;

      if (rawSession) {
        try {
          const session = JSON.parse(rawSession);
          if (session.user && session.loggedAt) {
            autenticado = true;
          }
        } catch(e) {}
      }

      if (!autenticado) {
        // Redirige al login y guarda la página a la que quería entrar
        const currentPath = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.replace("/login/?redirect=" + currentPath);
      }
    })();
  </script>
  <!-- Resto de tus fuentes, estilos y scripts de admisión -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admisión Clínica y GeoID — Servivett</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #008080;
      --primary-dark: #006666;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    
    .panel { width: 100%; max-width: 540px; background: var(--card); border-radius: 24px; padding: 26px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.35rem; font-weight: 800; color: var(--primary); }
    .header p { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

    .section-title { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; margin: 18px 0 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-doc { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
    .grid-phone { display: grid; grid-template-columns: 140px 1fr; gap: 8px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    input, select { width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.9rem; outline: none; transition: 0.2s; background: #fff; }
    input:focus, select:focus { border-color: var(--primary); }

    .badge-status {
      display: none;
      font-size: 0.75rem;
      font-weight: 700;
      color: #047857;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      padding: 7px 10px;
      border-radius: 8px;
      margin-top: 6px;
    }

    .btn-submit { width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 16px; transition: 0.2s; }
    .btn-submit:hover { background: var(--primary-dark); }

    .result-card { display: none; margin-top: 20px; padding: 20px; background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 18px; text-align: center; }
    .result-card h3 { color: #166534; font-size: 1.1rem; margin-bottom: 6px; }
    .qr-img { width: 180px; height: 180px; margin: 14px auto; display: block; background: #fff; padding: 8px; border-radius: 12px; border: 1px solid #bbf7d0; }
    .btn-wa { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <h1>Admisión de Paciente & GeoID</h1>
      <p>Servivett Gestión Clínica</p>
    </div>

    <form id="registro-form" onsubmit="guardarRegistro(event)">
      <div class="section-title">Datos del Tutor</div>
      
      <!-- CÉDULA DE PRIMERA -->
      <div class="form-group">
        <label>Documento de Identidad (Cédula / RUC)</label>
        <div class="grid-doc">
          <select id="tutor_tipo_doc">
            <option value="Cédula">Cédula</option>
            <option value="RUC">RUC</option>
            <option value="Pasaporte">Pasaporte</option>
          </select>
          <input type="text" id="tutor_cedula" placeholder="Ej. 1751594068" required autocomplete="off">
        </div>
        <div id="tutor-status-badge" class="badge-status">
          <!-- Texto dinámico generado por JavaScript -->
        </div>
      </div>

      <div class="form-group">
        <label>Nombre y Apellidos</label>
        <input type="text" id="tutor_nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label>Teléfono de Contacto (WhatsApp)</label>
        <div class="grid-phone">
          <select id="prefijo_pais">
            <option value="+593" selected>🇪🇨 +593 (EC)</option>
            <option value="+57">🇨🇴 +57 (CO)</option>
            <option value="+51">🇵🇪 +51 (PE)</option>
            <option value="+1">🇺🇸 +1 (US)</option>
            <option value="+34">🇪🇸 +34 (ES)</option>
            <option value="+54">🇦🇷 +54 (AR)</option>
            <option value="+56">🇨🇱 +56 (CL)</option>
            <option value="+52">🇲🇽 +52 (MX)</option>
          </select>
          <input type="tel" id="tutor_telefono" placeholder="0991234567" required>
        </div>
      </div>

      <div class="form-group">
        <label>Dirección Domiciliaria</label>
        <input type="text" id="tutor_direccion" placeholder="Sector, calles principal y secundaria" required>
      </div>

      <div class="section-title">Datos del Paciente</div>
      
      <div class="form-group">
        <label>Nombre del Paciente</label>
        <input type="text" id="paciente_nombre" placeholder="Ej. Pelusa" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Especie</label>
          <select id="paciente_especie" onchange="actualizarRazas()">
            <option value="Canino" selected>Canino</option>
            <option value="Felino">Felino</option>
            <option value="Equino">Equino</option>
            <option value="Bovino">Bovino</option>
            <option value="Porcino">Porcino</option>
            <option value="Cunícola">Cunícola</option>
            <option value="Roedor">Roedor</option>
          </select>
        </div>
        <div class="form-group">
          <label>Raza</label>
          <select id="paciente_raza">
            <!-- Cargado automáticamente vía catálogo -->
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Sexo</label>
          <select id="paciente_sexo">
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de Nacimiento</label>
          <input type="date" id="paciente_nacimiento" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-guardar">Registrar y Generar GeoID</button>
    </form>

    <div class="result-card" id="resultado">
      <h3>¡Paciente Registrado!</h3>
      <p style="font-size: 0.85rem; color: #166534;" id="res-nombre"></p>
      
      <img id="qr-preview" class="qr-img" src="" alt="Código QR">

      <a id="btn-enviar-wa" class="btn-wa" href="#" target="_blank">
        💬 Enviar Carné y GeoID al Tutor
      </a>
      
      <a id="link-directo" href="#" target="_blank" style="display: block; font-size: 0.75rem; color: #047857; margin-top: 10px; word-break: break-all;"></a>
    </div>
  </div>

  <script>
    const CATALOGO_RAZAS = {
      Canino: [
        "Mestizo", "Shih Tzu", "Poodle", "Schnauzer", "Golden Retriever",
        "Labrador Retriever", "Pastor Alemán", "Bulldog Francés", "Chihuahua",
        "Pug", "Yorkshire Terrier", "Beagle", "Rottweiler", "Husky Siberiano",
        "Pitbull Terrier", "Dóberman", "Boxer", "Gran Danés", "Dachshund"
      ],
      Felino: [
        "Mestizo / Común Europeo", "Siamés", "Persa", "Maine Coon", "Bengala",
        "Ragdoll", "British Shorthair", "Sphynx", "Angora Turco", "Azul Ruso"
      ],
      Equino: [
        "Mestizo / Criollo", "Pura Sangre Inglés", "Cuarto de Milla", "Paso Fino",
        "Árabe", "Español / Andaluz", "Appaloosa", "Frisón", "Percherón"
      ],
      Bovino: [
        "Mestizo / Criollo", "Holstein Friesian", "Jersey", "Brown Swiss",
        "Gyr", "Brahman", "Angus", "Simmental", "Charolais"
      ],
      Porcino: ["Mestizo"],
      Cunícola: ["Mestizo"],
      Roedor: ["Mestizo"]
    };

    function actualizarRazas() {
      const especie = document.getElementById("paciente_especie").value;
      const selectRaza = document.getElementById("paciente_raza");
      selectRaza.innerHTML = "";

      const razas = CATALOGO_RAZAS[especie] || ["Mestizo"];
      razas.forEach(raza => {
        const opt = document.createElement("option");
        opt.value = raza;
        opt.textContent = raza;
        selectRaza.appendChild(opt);
      });
    }

    actualizarRazas();

    const SUPABASE_URL = "https://llwbvbzrbdxlrhswgjft.supabase.co";
    const SUPABASE_KEY = "sb_publishable_1k62mMMn9VzV_IT1tf2M-g_NDAeLMZX";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let tutorExistenteId = null;

    // AUTOCOMPLETADO AUTOMÁTICO EN TIEMPO REAL
    const inputCedula = document.getElementById("tutor_cedula");
    inputCedula.addEventListener("input", async () => {
      const doc = inputCedula.value.trim();
      const badge = document.getElementById("tutor-status-badge");

      // Verificamos si completó los 10 dígitos de cédula o 13 de RUC
      if (doc.length !== 10 && doc.length !== 13) {
        badge.style.display = "none";
        tutorExistenteId = null;
        return;
      }

      try {
        const { data: tutor, error } = await supabaseClient
          .from("tutores")
          .select("id, nombres, telefono, direccion, tipo_documento")
          .eq("cedula_ruc", doc)
          .maybeSingle();

        if (tutor) {
          tutorExistenteId = tutor.id;
          document.getElementById("tutor_nombre").value = tutor.nombres;
          document.getElementById("tutor_direccion").value = tutor.direccion || "";

          // Formatear el teléfono celular
          if (tutor.telefono) {
            let tel = tutor.telefono;
            if (tel.startsWith("+593")) {
              document.getElementById("prefijo_pais").value = "+593";
              document.getElementById("tutor_telefono").value = "0" + tel.substring(4);
            } else {
              document.getElementById("tutor_telefono").value = tel;
            }
          }

          if (tutor.tipo_documento) {
            document.getElementById("tutor_tipo_doc").value = tutor.tipo_documento;
          }

          badge.style.display = "block";
          badge.textContent = `✓ Tutor encontrado: ${tutor.nombres} (Datos cargados)`;
          
          // Saltar directo al nombre del paciente para no perder tiempo
          document.getElementById("paciente_nombre").focus();
        } else {
          tutorExistenteId = null;
          badge.style.display = "none";
        }
      } catch (err) {
        console.warn("Búsqueda de tutor:", err);
      }
    });

    async function guardarRegistro(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-guardar");
      btn.disabled = true;
      btn.textContent = "Procesando...";

      const tutorNombre = document.getElementById("tutor_nombre").value.trim();
      const tutorTipoDoc = document.getElementById("tutor_tipo_doc").value;
      const tutorDoc = document.getElementById("tutor_cedula").value.trim();
      const prefijo = document.getElementById("prefijo_pais").value;
      let rawTel = document.getElementById("tutor_telefono").value.trim().replace(/\D/g, "");
      
      if (prefijo === "+593" && rawTel.startsWith("0")) {
        rawTel = rawTel.substring(1);
      }
      const telefonoCompleto = prefijo + rawTel;
      const tutorDireccion = document.getElementById("tutor_direccion").value.trim();

      const pacNombre = document.getElementById("paciente_nombre").value.trim();
      const pacEspecie = document.getElementById("paciente_especie").value;
      const pacRaza = document.getElementById("paciente_raza").value;
      const pacSexo = document.getElementById("paciente_sexo").value;
      const pacNac = document.getElementById("paciente_nacimiento").value;

      try {
        let finalTutorId = tutorExistenteId;

        // Comprobación de seguridad por si el tutor ya existía pero no se disparó el input
        if (!finalTutorId) {
          const { data: existente } = await supabaseClient
            .from("tutores")
            .select("id")
            .eq("cedula_ruc", tutorDoc)
            .maybeSingle();

          if (existente) {
            finalTutorId = existente.id;
          }
        }

        // Si ya existe actualizamos su contacto; si no, lo creamos
        if (finalTutorId) {
          await supabaseClient
            .from("tutores")
            .update({
              nombres: tutorNombre,
              telefono: telefonoCompleto,
              direccion: tutorDireccion,
              tipo_documento: tutorTipoDoc
            })
            .eq("id", finalTutorId);
        } else {
          const { data: nuevoTutor, error: errTutor } = await supabaseClient
            .from("tutores")
            .insert([{
              nombres: tutorNombre,
              cedula_ruc: tutorDoc,
              telefono: telefonoCompleto,
              direccion: tutorDireccion,
              tipo_documento: tutorTipoDoc
            }])
            .select("id")
            .single();

          if (errTutor) throw errTutor;
          finalTutorId = nuevoTutor.id;
        }

        // Registrar la nueva mascota con el ID de ese tutor
        const uidGenerado = "SVT-" + Math.floor(1000 + Math.random() * 9000);
        const { data: pac, error: errPac } = await supabaseClient
          .from("pacientes")
          .insert([{
            tutor_id: finalTutorId,
            uid_clinico: uidGenerado,
            nombre: pacNombre,
            especie: pacEspecie,
            raza: pacRaza,
            sexo: pacSexo,
            fecha_nacimiento: pacNac,
            estado_vital: "ACTIVO"
          }])
          .select()
          .single();

        if (errPac) throw errPac;

        // Generar enlace y código QR
        const urlFicha = `https://www.servivett.com/p/?id=${pac.token_publico}`;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&ecc=H&margin=2&data=${encodeURIComponent(urlFicha)}`;

        document.getElementById("res-nombre").textContent = `${pac.nombre} (${pac.uid_clinico})`;
        document.getElementById("qr-preview").src = qrUrl;

        const linkDir = document.getElementById("link-directo");
        linkDir.href = urlFicha;
        linkDir.textContent = urlFicha;

        const fonoWa = telefonoCompleto.replace("+", "");
        const primerNombreTutor = tutorNombre.split(" ")[0];
        const mensajeWa = encodeURIComponent(`Hola ${primerNombreTutor}, el carné digital y GeoID de ${pacNombre} ya está activo en Clínica Servivett:\n\n${urlFicha}`);
        document.getElementById("btn-enviar-wa").href = `https://wa.me/${fonoWa}?text=${mensajeWa}`;

        document.getElementById("resultado").style.display = "block";
        document.getElementById("registro-form").reset();
        document.getElementById("tutor-status-badge").style.display = "none";
        tutorExistenteId = null;
        actualizarRazas();

      } catch (err) {
        alert("Error al registrar: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Registrar y Generar GeoID";
      }
    }
  </script>
</body>
</html>
