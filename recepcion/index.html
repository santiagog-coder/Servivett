<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servivett OS · Terminal de Recepción</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              emerald: '#059669',
              teal: '#0d9488',
              dark: '#0f172a'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Estilos para animación sutil de alerta moroso */
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .badge-moroso-pulse {
      animation: pulse-subtle 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-emerald selection:text-white">

  <!-- ================= 1. HEADER SUPERIOR ================= -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm flex-shrink-0">
    <div class="max-w-[1680px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      
      <!-- LOGO Y SEDE -->
      <div class="flex items-center gap-3 min-w-[240px]">
        <div class="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center text-white font-extrabold text-base tracking-tighter shadow-sm">
          SV
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-slate-900 tracking-tight text-sm uppercase">Servivett OS</span>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
              Yaruquí
            </span>
          </div>
          <p class="text-[11px] font-medium text-slate-400">Recepción / Mostrador</p>
        </div>
      </div>

      <!-- INPUT DE BÚSQUEDA UNIVERSAL (CON ATAJO F1) -->
      <div class="flex-1 max-w-2xl relative">
        <div class="relative flex items-center">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          
          <input 
            type="text" 
            id="globalSearchInput"
            autocomplete="off"
            placeholder="Buscar por Mascota, Tutor, Cédula (10 dígitos) o UID..."
            class="w-full pl-10 pr-16 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-emerald focus:border-brand-emerald transition-all shadow-inner"
          >
          
          <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center">
            <kbd class="inline-flex items-center px-2 py-0.5 border border-slate-300 rounded text-[11px] font-bold text-slate-500 bg-white shadow-sm cursor-pointer select-none" onclick="document.getElementById('globalSearchInput').focus()">
              F1
            </kbd>
          </div>
        </div>

        <!-- DROPDOWN FLOTANTE DE RESULTADOS DE BÚSQUEDA -->
        <div 
          id="searchResultsDropdown" 
          class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-2xl border border-slate-200 max-h-[460px] overflow-y-auto divide-y divide-slate-100 z-50"
        >
          <!-- Contenido inyectado dinámicamente -->
        </div>
      </div>

      <!-- ACCIONES Y ESTADO EN VIVO -->
      <div class="flex items-center gap-4 min-w-[240px] justify-end">
        <div class="flex items-center gap-2 text-xs font-medium text-slate-500 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-200">
          <span id="connectionDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="connectionText">En línea</span>
        </div>

        <a 
          href="/nuevo/" 
          class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs transition-colors shadow-sm focus:ring-2 focus:ring-emerald-500 focus:ring-offset-1"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
          </svg>
          Nuevo Paciente
        </a>
      </div>

    </div>
  </header>

  <!-- ================= LAYOUT PRINCIPAL DE 2 COLUMNAS ================= -->
  <main class="flex-1 max-w-[1680px] w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">
    
    <!-- ================= COLUMNA IZQUIERDA: TRÁFICO Y SALA DE ESPERA (60% / 7 COLS) ================= -->
    <section class="lg:col-span-7 flex flex-col bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden h-[calc(100vh-100px)]">
      
      <!-- CABECERA Y PESTAÑAS -->
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
        <div>
          <h2 class="text-sm font-bold text-slate-900 tracking-tight uppercase">Salas de Espera en Vivo</h2>
          <p class="text-xs text-slate-500">Pacientes físicamente presentes en la clínica</p>
        </div>

        <!-- Pestañas de Área -->
        <div class="flex items-center bg-slate-200/70 p-1 rounded-lg text-xs font-semibold">
          <button 
            id="tabMedicaBtn" 
            onclick="cambiarPestanaEspera('medica')"
            class="px-3 py-1.5 rounded-md bg-white text-slate-900 shadow-sm transition-all flex items-center gap-1.5"
          >
            <span>🩺</span>
            <span>Espera Médica</span>
            <span id="badgeCountMedica" class="ml-1 px-1.5 py-0.2 rounded-full text-[10px] bg-slate-100 text-slate-600 font-bold">0</span>
          </button>
          
          <button 
            id="tabPeluqueriaBtn" 
            onclick="cambiarPestanaEspera('peluqueria')"
            class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5"
          >
            <span>✂️</span>
            <span>Peluquería</span>
            <span id="badgeCountPeluqueria" class="ml-1 px-1.5 py-0.2 rounded-full text-[10px] bg-slate-100 text-slate-600 font-bold">0</span>
          </button>
        </div>
      </div>

      <!-- LISTADO DE PACIENTES EN ESPERA (SCROLLABLE) -->
      <div id="listaEsperaContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Renderizado dinámico desde Supabase -->
      </div>
    </section>

    <!-- ================= COLUMNA DERECHA: COBROS Y MOROSIDAD (40% / 5 COLS) ================= -->
    <section class="lg:col-span-5 flex flex-col gap-6 h-[calc(100vh-100px)] overflow-y-auto pr-1">
      
      <!-- SECCIÓN 1: ATENCIONES DEL DÍA POR COBRAR -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
        <div class="p-3.5 px-4 border-b border-slate-200 bg-amber-50/40 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-amber-600 text-sm">💳</span>
            <h3 class="text-xs font-bold text-slate-900 uppercase tracking-tight">Atenciones por Cobrar / Liquidar</h3>
          </div>
          <span id="badgePorCobrarCount" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-200">
            0
          </span>
        </div>

        <div id="listaPorCobrarContainer" class="p-3 divide-y divide-slate-100 max-h-[280px] overflow-y-auto">
          <!-- Renderizado dinámico -->
        </div>
      </div>

      <!-- SECCIÓN 2: MONITOR DE MOROSOS / SALDOS PENDIENTES -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex-1 flex flex-col overflow-hidden">
        <div class="p-3.5 px-4 border-b border-slate-200 bg-rose-50/40 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-rose-600 text-sm">⚠️</span>
            <h3 class="text-xs font-bold text-slate-900 uppercase tracking-tight">Monitor de Saldos Pendientes (Cuentas por Cobrar)</h3>
          </div>
          <span id="badgeMorososTotal" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 border border-rose-200">
            $0.00
          </span>
        </div>

        <div id="listaMorososContainer" class="p-3 flex-1 overflow-y-auto space-y-2.5">
          <!-- Renderizado dinámico -->
        </div>
      </div>

    </section>

  </main>

  <!-- ================= LÓGICA FRONTEND REACTIVA CON SUPABASE ================= -->
  <script>
    // 1. CONFIGURACIÓN CLIENTE SUPABASE OFICIAL
    const SUPABASE_URL = "https://llwbvbzrbdxlrhswgjft.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1k62mMMn9VzV_IT1tf2M-g_NDAeLMZX";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado local de la interfaz
    let pestanaActiva = 'medica'; // 'medica' | 'peluqueria'
    let debounceTimer = null;

    // Helper: Formato de tiempo relativo
    function calcularTiempoEspera(timestampStr) {
      if (!timestampStr) return "Recién llegado";
      const llegada = new Date(timestampStr);
      const ahora = new Date();
      const diffMs = ahora - llegada;
      const diffMin = Math.floor(diffMs / 60000);

      if (diffMin < 1) return "Recién llegado";
      if (diffMin < 60) return `Esperando ${diffMin} min`;
      const horas = Math.floor(diffMin / 60);
      const minRest = diffMin % 60;
      return `Esperando ${horas}h ${minRest}m`;
    }

    // Helper: Formato Moneda
    function formatMoney(amount) {
      return new Intl.NumberFormat('es-EC', { style: 'currency', currency: 'USD' }).format(amount || 0);
    }

    // ================= 2. CARGA DE SALAS DE ESPERA =================
    async function cargarSalasEspera() {
      const container = document.getElementById('listaEsperaContainer');

      try {
        const { data, error } = await supabase
          .from('citas_turnos')
          .select('*')
          .eq('estado', 'espera')
          .order('hora_llegada', { ascending: true });

        if (error) throw error;

        const turnosMedica = (data || []).filter(t => t.area === 'medica');
        const turnosPeluqueria = (data || []).filter(t => t.area === 'peluqueria');

        document.getElementById('badgeCountMedica').innerText = turnosMedica.length;
        document.getElementById('badgeCountPeluqueria').innerText = turnosPeluqueria.length;

        const turnosMostrar = pestanaActiva === 'medica' ? turnosMedica : turnosPeluqueria;

        if (turnosMostrar.length === 0) {
          container.innerHTML = `
            <div class="h-64 flex flex-col items-center justify-center text-center p-6 border-2 border-dashed border-slate-200 rounded-xl">
              <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-xl mb-3">
                ${pestanaActiva === 'medica' ? '🩺' : '✂️'}
              </div>
              <h4 class="text-sm font-semibold text-slate-700">No hay pacientes en sala de espera</h4>
              <p class="text-xs text-slate-400 mt-1 max-w-xs">Usa el buscador superior [F1] para admitir un paciente en esta sala.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = turnosMostrar.map(turno => {
          const especieIcon = (turno.especie || '').toLowerCase().includes('fel') ? '🐱' : '🐶';
          return `
            <div class="p-3.5 bg-white border border-slate-200 hover:border-slate-300 rounded-xl shadow-sm transition-all flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center text-lg">
                  ${especieIcon}
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-slate-900">${turno.paciente_nombre || 'Sin Nombre'}</span>
                    <span class="text-[11px] text-slate-400 font-medium">(${turno.especie || 'Mascota'})</span>
                  </div>
                  <div class="text-xs text-slate-500 mt-0.5">
                    Tutor: <span class="font-medium text-slate-700">${turno.tutor_nombre || 'N/A'}</span>
                  </div>
                  <div class="inline-flex items-center gap-1 text-[11px] font-semibold text-amber-600 mt-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    ${calcularTiempoEspera(turno.hora_llegada || turno.created_at)}
                  </div>
                </div>
              </div>

              <div>
                <button 
                  onclick="pasarAAtencion('${turno.id}')"
                  class="px-3.5 py-1.5 rounded-lg bg-brand-emerald hover:bg-emerald-700 text-white font-semibold text-xs shadow-sm transition-all flex items-center gap-1.5"
                >
                  Pasar a Atención
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Error al cargar sala de espera:", err);
      }
    }

    function cambiarPestanaEspera(area) {
      pestanaActiva = area;
      const btnMed = document.getElementById('tabMedicaBtn');
      const btnPel = document.getElementById('tabPeluqueriaBtn');

      if (area === 'medica') {
        btnMed.className = "px-3 py-1.5 rounded-md bg-white text-slate-900 shadow-sm transition-all flex items-center gap-1.5";
        btnPel.className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5";
      } else {
        btnPel.className = "px-3 py-1.5 rounded-md bg-white text-slate-900 shadow-sm transition-all flex items-center gap-1.5";
        btnMed.className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5";
      }
      cargarSalasEspera();
    }

    async function pasarAAtencion(turnoId) {
      try {
        const { error } = await supabase
          .from('citas_turnos')
          .update({ estado: 'en_atencion' })
          .eq('id', turnoId);

        if (error) throw error;
        cargarSalasEspera();
      } catch (err) {
        alert("Error al pasar paciente a atención: " + err.message);
      }
    }

    // ================= 3. CARGA DE COBROS Y MOROSIDAD =================
    async function cargarPorCobrar() {
      const container = document.getElementById('listaPorCobrarContainer');
      const badge = document.getElementById('badgePorCobrarCount');

      try {
        const { data, error } = await supabase
          .from('citas_turnos')
          .select('*')
          .eq('estado', 'por_cobrar')
          .order('created_at', { ascending: false });

        if (error) throw error;

        badge.innerText = (data || []).length;

        if (!data || data.length === 0) {
          container.innerHTML = `
            <div class="py-6 text-center text-xs text-slate-400">
              No hay liquidaciones pendientes en este momento.
            </div>
          `;
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="py-2.5 flex items-center justify-between gap-3">
            <div>
              <div class="text-xs font-bold text-slate-900">${item.paciente_nombre || 'Paciente'}</div>
              <div class="text-[11px] text-slate-500">Tutor: ${item.tutor_nombre || 'N/A'}</div>
            </div>
            <button 
              onclick="liquidarTurno('${item.id}')"
              class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded-md text-xs font-semibold transition-colors"
            >
              Liquidar / Cobrar
            </button>
          </div>
        `).join('');

      } catch (err) {
        console.error("Error al cargar atenciones por cobrar:", err);
      }
    }

    async function liquidarTurno(turnoId) {
      const confirmacion = confirm("¿Deseas marcar este turno como liquidado/finalizado?");
      if (!confirmacion) return;

      try {
        const { error } = await supabase
          .from('citas_turnos')
          .update({ estado: 'finalizado' })
          .eq('id', turnoId);

        if (error) throw error;
        cargarPorCobrar();
      } catch (err) {
        alert("Error al liquidar: " + err.message);
      }
    }

    async function cargarMorosos() {
      const container = document.getElementById('listaMorososContainer');
      const totalBadge = document.getElementById('badgeMorososTotal');

      try {
        const { data, error } = await supabase
          .from('cuentas_cobrar')
          .select('*')
          .gt('saldo_pendiente', 0)
          .order('saldo_pendiente', { ascending: false });

        if (error) throw error;

        const totalDeuda = (data || []).reduce((acc, curr) => acc + Number(curr.saldo_pendiente || 0), 0);
        totalBadge.innerText = formatMoney(totalDeuda);

        if (!data || data.length === 0) {
          container.innerHTML = `
            <div class="py-8 text-center text-xs text-slate-400">
              Excelente: No hay saldos pendientes registrados.
            </div>
          `;
          return;
        }

        container.innerHTML = data.map(m => {
          // Limpieza de teléfono para WhatsApp ecuatoriano (+593)
          let phoneClean = (m.tutor_telefono || '').replace(/\D/g, '');
          if (phoneClean.startsWith('0')) phoneClean = '593' + phoneClean.slice(1);
          if (!phoneClean.startsWith('593') && phoneClean.length === 9) phoneClean = '593' + phoneClean;

          const msj = encodeURIComponent(`Hola ${m.tutor_nombre}, le saludamos de Servivett Clínica Veterinaria. Nos comunicamos para coordinar la regularización de su saldo pendiente de ${formatMoney(m.saldo_pendiente)} por concepto de ${m.motivo || 'atención médica'}. Quedamos a su disposición.`);
          const waLink = `https://wa.me/${phoneClean}?text=${msj}`;

          return `
            <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-lg flex items-center justify-between gap-3">
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-slate-900 truncate">${m.tutor_nombre}</span>
                  <span class="text-xs font-extrabold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-200">
                    ${formatMoney(m.saldo_pendiente)}
                  </span>
                </div>
                <div class="text-[11px] text-slate-500 truncate mt-0.5">${m.motivo || 'Servicios clínicos'}</div>
              </div>

              <div>
                <a 
                  href="${waLink}" 
                  target="_blank"
                  class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-semibold transition-colors"
                >
                  <span>WhatsApp</span>
                </a>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Error al cargar cuentas por cobrar:", err);
      }
    }

    // ================= 4. BÚSQUEDA UNIVERSAL (DEBOUNCE 250ms) =================
    const searchInput = document.getElementById('globalSearchInput');
    const dropdown = document.getElementById('searchResultsDropdown');

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();

      if (!query) {
        dropdown.classList.add('hidden');
        dropdown.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(() => {
        ejecutarBusquedaUniversal(query);
      }, 250);
    });

    async function ejecutarBusquedaUniversal(termino) {
      dropdown.classList.remove('hidden');
      dropdown.innerHTML = `
        <div class="p-4 text-center text-xs text-slate-400">
          Consultando base de datos en tiempo real...
        </div>
      `;

      try {
        let queryBuilder = supabase.from('vista_recepcion_busqueda').select('*');

        // Regla: Si son 10 dígitos numéricos exactos, búsqueda estricta por cédula
        const esCedula = /^\d{10}$/.test(termino);

        if (esCedula) {
          queryBuilder = queryBuilder.eq('tutor_cedula', termino);
        } else {
          queryBuilder = queryBuilder.or(`paciente_nombre.ilike.%${termino}%,tutor_nombre.ilike.%${termino}%,uid_clinico.ilike.%${termino}%`);
        }

        const { data, error } = await queryBuilder.limit(8);

        if (error) throw error;

        if (!data || data.length === 0) {
          dropdown.innerHTML = `
            <div class="p-6 text-center">
              <p class="text-xs font-semibold text-slate-600">No se encontraron resultados para "${termino}"</p>
              <a href="/nuevo/" class="mt-2 inline-block text-xs font-bold text-brand-emerald hover:underline">+ Crear nueva ficha</a>
            </div>
          `;
          return;
        }

        dropdown.innerHTML = data.map(res => {
          const icono = (res.especie || '').toLowerCase().includes('fel') ? '🐱' : '🐶';
          const tieneDeuda = Number(res.saldo_deudor || 0) > 0;

          return `
            <div class="p-3.5 hover:bg-slate-50 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-base">${icono}</span>
                  <span class="text-sm font-bold text-slate-900">${res.paciente_nombre}</span>
                  <span class="text-xs text-slate-400 font-mono">UID: ${res.uid_clinico || 'S/N'}</span>
                  ${tieneDeuda ? `
                    <span class="badge-moroso-pulse inline-flex items-center px-2 py-0.5 rounded text-[10px] font-extrabold bg-rose-100 text-rose-700 border border-rose-300">
                      ⚠️ Saldo pendiente: ${formatMoney(res.saldo_deudor)}
                    </span>
                  ` : ''}
                </div>

                <div class="text-xs text-slate-500 mt-1">
                  Tutor: <span class="font-medium text-slate-800">${res.tutor_nombre}</span> 
                  · C.I.: <span class="font-mono text-slate-700">${res.tutor_cedula || 'N/A'}</span>
                  ${res.tutor_sector ? `· Sector: <span class="text-slate-600">${res.tutor_sector}</span>` : ''}
                </div>
              </div>

              <!-- ACCIONES RÁPIDAS 1-CLIC -->
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <button 
                  onclick="encolarPaciente('${res.paciente_id}', '${res.paciente_nombre}', '${res.tutor_nombre}', '${res.especie}', 'medica')"
                  class="px-2.5 py-1.5 rounded bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200 border border-slate-200 text-xs font-semibold text-slate-700 transition-all"
                  title="Poner en Sala de Espera Médica"
                >
                  + 🩺 Médica
                </button>

                <button 
                  onclick="encolarPaciente('${res.paciente_id}', '${res.paciente_nombre}', '${res.tutor_nombre}', '${res.especie}', 'peluqueria')"
                  class="px-2.5 py-1.5 rounded bg-slate-100 hover:bg-cyan-50 hover:text-cyan-700 hover:border-cyan-200 border border-slate-200 text-xs font-semibold text-slate-700 transition-all"
                  title="Poner en Peluquería"
                >
                  + ✂️ Peluquería
                </button>

                <a 
                  href="/recepcion/ficha/?id=${res.paciente_id}"
                  class="px-2.5 py-1.5 rounded bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition-all"
                >
                  Abrir Ficha
                </a>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Error en búsqueda reactiva:", err);
        dropdown.innerHTML = `
          <div class="p-4 text-center text-xs text-rose-500">
            Error al consultar la vista 'vista_recepcion_busqueda': Asegúrate de que la vista exista en Supabase.
          </div>
        `;
      }
    }

    async function encolarPaciente(pacienteId, pacienteNombre, tutorNombre, especie, area) {
      try {
        const { error } = await supabase
          .from('citas_turnos')
          .insert([{
            paciente_id: pacienteId,
            paciente_nombre: pacienteNombre,
            tutor_nombre: tutorNombre,
            especie: especie,
            area: area,
            estado: 'espera',
            hora_llegada: new Date().toISOString()
          }]);

        if (error) throw error;

        // Limpiar buscador y actualizar sala
        dropdown.classList.add('hidden');
        searchInput.value = '';
        pestanaActiva = area;
        cambiarPestanaEspera(area);

      } catch (err) {
        alert("Error al encolar paciente: " + err.message);
      }
    }

    // ================= 5. ATAJOS DE TECLADO Y EVENTOS GLOBALES =================
    window.addEventListener('keydown', (e) => {
      // Atajo F1: Enfocar buscador
      if (e.key === 'F1') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
      // Escape: Cerrar dropdown
      if (e.key === 'Escape') {
        dropdown.classList.add('hidden');
      }
    });

    // Cerrar dropdown al hacer click afuera
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });

    // ================= 6. INICIALIZACIÓN Y CICLO DE ACTUALIZACIÓN =================
    function actualizarTodo() {
      cargarSalasEspera();
      cargarPorCobrar();
      cargarMorosos();
    }

    // Carga inicial inmediata
    actualizarTodo();

    // Refresco periódico cada 15 segundos (polling ligero)
    setInterval(actualizarTodo, 15000);
  </script>
</body>
</html>
